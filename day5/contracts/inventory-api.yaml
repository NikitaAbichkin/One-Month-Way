openapi: 3.1.0
info:
  title: My service
  description: My service
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
    description: 'local network'
paths:
  /stock/{productId}:
    get:
      operationId: getStock #имя метода
      summary: 'остаток по товару'
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Остаток найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '404':
          description: Товар не найден



components:
  schemas:
    StockResponse:
      type: object
      required:
        - productId
        - available
      properties:
        productId:
          type: integer
          format: int64
        available:
          type: integer
          format: int32
