global:
  scrape_interval: 15s            # как часто опрашивать (по заданию)

scrape_configs:
  - job_name: order                # имя группы, например order
    metrics_path: /actuator/prometheus             # путь, где сервис отдаёт метрики
    static_configs:
      - targets: [ "order:8081" ]

  - job_name: inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "inventory:8082" ]

  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:  [ "payment:8083" ]
