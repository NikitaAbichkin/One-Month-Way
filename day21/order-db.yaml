# ===== 1. Deployment: "держи 1 под с postgres" =====
#Запустится на одном из нодов
apiVersion: apps/v1          # (оставь как есть)
kind: Deployment             # (оставь как есть)
metadata:
  name: order-db
spec:
  replicas: 1                 # сколько подов: 1
  selector:
    matchLabels:
      app:  order-db                 # метка, по которой Deployment находит свои поды: order-db
  template:                   # шаблон пода
    metadata:
      labels:
        app: order-db             # такая же метка, как выше: order-db
    spec:
      containers:
        - name: postgres-order-db             # имя контейнера: postgres
          image: postgres:17           # образ: postgres:17
          ports:
            - containerPort: 5432 # порт внутри контейнера: 5432
          env:               # переменные, как в compose
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
          readinessProbe:            # готов ли Postgres принимать подключения
            exec:
              command: ["pg_isready", "-h", "localhost", "-U", "app", "-d", "order_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
# ===== 2. Service: постоянное имя order-db:5432 =====
apiVersion: v1
kind: Service
metadata:
  name: order-db                   # имя Service: order-db (по нему order найдёт БД)
spec:
  selector:
    app:  order-db                   # на какие поды слать трафик: order-db (та же метка)
  ports:
    - port: 5432 # порт Service: 5432
      targetPort: 5432 # порт контейнера: 5432


