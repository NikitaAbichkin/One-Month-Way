spring.application.name=api-gateway
server.port=8080

# маршруты по REST: путь запроса совпадает с путем в сервисе (префикс не режем)
# адреса сервисов берутся из переменных окружения (в docker compose это имена сервисов)
spring.cloud.gateway.server.webflux.routes[0].id=users
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOG_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/catalog/**

# заказы и webhook службы доставки живут в order-service
spring.cloud.gateway.server.webflux.routes[2].id=orders
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**,/webhooks/**

spring.cloud.gateway.server.webflux.routes[3].id=inventory
spring.cloud.gateway.server.webflux.routes[3].uri=${INVENTORY_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/inventory/**

spring.cloud.gateway.server.webflux.routes[4].id=payments
spring.cloud.gateway.server.webflux.routes[4].uri=${PAYMENT_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payments/**

#Prometheus Endpoint
management.endpoints.web.exposure.include=health,prometheus

# записывать 100% трейсов
management.tracing.sampling.probability=1.0

#куда отправлять traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
