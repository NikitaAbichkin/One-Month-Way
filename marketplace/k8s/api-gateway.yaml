# ===== Deployment: поды api-gateway =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1                      # сколько подов
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway                # такая же метка
    spec:
      initContainers:              # k8s не умеет depends_on: ждем, пока БД и Kafka начнут принимать подключения
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z order 8081; do sleep 2; done; until nc -z user 8085; do sleep 2; done;"]
      containers:
        - name: api-gateway
          image: marketplace-api-gateway:latest   # образ из docker compose build, загруженный через kind load
          imagePullPolicy: IfNotPresent      # без этого для тега latest k8s пойдет в интернет за образом
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 768Mi
          env:                     # то же, что environment в compose
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0"
            - name: USER_URL
              value: "http://user:8085"
            - name: CATALOG_URL
              value: "http://catalog:8084"
            - name: ORDER_URL
              value: "http://order:8081"
            - name: INVENTORY_URL
              value: "http://inventory:8082"
            - name: PAYMENT_URL
              value: "http://payment:8083"
          readinessProbe:          # готов ли под принимать трафик
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:           # жив ли процесс (если нет, kubelet перезапустит контейнер)
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
---
# ===== Service: постоянное имя api-gateway:8080 (как имя сервиса в compose) =====
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
