# kubectl apply -f k8s/notification.yaml
# ===== 1. ConfigMap: несекретные настройки notification-service =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---
# ===== 2. Deployment: notification-service =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: notification:1.0
          ports:
            - containerPort: 8086
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1
              memory: 768Mi

          envFrom:
            - configMapRef:
                name:  notification-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: notification-db

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            periodSeconds: 5 # перерыв
            failureThreshold: 5 # колличество неудачных попыток
            timeoutSeconds: 3 #  скольк ждать ответа по времени

          livenessProbe: # жив ли процесс (если нет, kubelet перезапустит контейнер)
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

          lifecycle:
            preStop:
              sleep:
                seconds: 5




---
# ===== 3. Service: адрес notification:8086 =====
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  selector:
    app: notification
  ports:
    - port: 8086
      targetPort: 8086
