# kubectl apply -f k8s/user.yaml
# ===== 1. ConfigMap: несекретные настройки user-service =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  PAYMENT_URL: http://payment:8083
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---
# ===== 2. Deployment: user-service =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: user:1.0
          ports:
            - containerPort: 8085
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1
              memory: 768Mi

          envFrom:
            - configMapRef:
                name:  user-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: user-db

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 5 # перерыв
            failureThreshold: 5 # колличество неудачных попыток
            timeoutSeconds: 3 #  скольк ждать ответа по времени

          livenessProbe: # жив ли процесс (если нет, kubelet перезапустит контейнер)
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

          lifecycle:
            preStop:
              sleep:
                seconds: 5




---
# ===== 3. Service: адрес user:8085 =====
apiVersion: v1
kind: Service
metadata:
  name: user
spec:
  selector:
    app: user
  ports:
    - port: 8085
      targetPort: 8085
