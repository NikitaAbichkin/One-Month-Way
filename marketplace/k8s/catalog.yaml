# kubectl apply -f k8s/catalog.yaml
# ===== 1. ConfigMap: несекретные настройки catalog-service =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---
# ===== 2. Deployment: catalog-service =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: catalog:1.0
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1
              memory: 768Mi

          envFrom:
            - configMapRef:
                name:  catalog-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: catalog-db

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            periodSeconds: 5 # перерыв
            failureThreshold: 5 # колличество неудачных попыток
            timeoutSeconds: 3 #  скольк ждать ответа по времени

          livenessProbe: # жив ли процесс (если нет, kubelet перезапустит контейнер)
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

          lifecycle:
            preStop:
              sleep:
                seconds: 5




---
# ===== 3. Service: адрес catalog:8084 =====
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector:
    app: catalog
  ports:
    - port: 8084
      targetPort: 8084
