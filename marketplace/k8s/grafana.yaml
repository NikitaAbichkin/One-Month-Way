apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000 # на каком порту будет работать контейнер



---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002 # какой порт ноды пробросить  и куда на какой порт пода пробросить
      # тоесть пишем localhost:30002 -> пробрасываем нам pod с port(3000)
