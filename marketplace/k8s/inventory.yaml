# kubectl apply -f k8s/inventory.yaml
# ===== 1. ConfigMap: несекретные настройки inventory-service =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---
# ===== 2. Deployment: inventory-service =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: inventory:1.0
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1
              memory: 768Mi

          envFrom:
            - configMapRef:
                name:  inventory-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: inventory-db

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5 # перерыв
            failureThreshold: 5 # колличество неудачных попыток
            timeoutSeconds: 3 #  скольк ждать ответа по времени

          livenessProbe: # жив ли процесс (если нет, kubelet перезапустит контейнер)
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

          lifecycle:
            preStop:
              sleep:
                seconds: 5




---
# ===== 3. Service: адрес inventory:8082 =====
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector:
    app: inventory
  ports:
    - port: 8082
      targetPort: 8082
