# kubectl apply -f k8s/order.yaml
# ===== 1. ConfigMap: несекретные настройки order-service =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---
# ===== 2. Deployment: order-service =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: order:1.0
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1
              memory: 768Mi

          envFrom:
            - configMapRef:
                name:  order-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: order-db

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5 # перерыв
            failureThreshold: 5 # колличество неудачных попыток
            timeoutSeconds: 3 #  скольк ждать ответа по времени

          livenessProbe: # жив ли процесс (если нет, kubelet перезапустит контейнер)
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3

          lifecycle:
            preStop:
              sleep:
                seconds: 5




---
# ===== 3. Service: адрес order:8081 =====
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  selector:
    app: order
  ports:
    - port: 8081
      targetPort: 8081
