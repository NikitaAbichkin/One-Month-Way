# kind create cluster --name marketplace --config kind-config.yaml   (из папки marketplace)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
    - containerPort: 30000
      hostPort: 8080
    - containerPort: 30001
      hostPort: 8090
    - containerPort: 30002
      hostPort: 3000
  - role: worker
  - role: worker

