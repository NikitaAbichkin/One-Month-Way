spring.application.name=order-serviceSwag
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5451/order_db
spring.datasource.username=app
spring.datasource.password=app
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:39092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
app.saga.timeout-seconds=30

#Prometheus Endpoint
management.endpoints.web.exposure.include=health,prometheus

# настраиваем чтобы корзины метрики "http.server.requests" были по 100мс, 250мс, 500мс, 1с
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s

# записывать 100% трейсов
management.tracing.sampling.probability=1.0

# KafkaTemplate создаёт спан на send и кладёт traceparent в заголовок сообщения
spring.kafka.template.observation-enabled=true
# слушатель (ответы inventory/payment) читает traceparent из заголовка и продолжает трейс
spring.kafka.listener.observation-enabled=true

#куда отправлять traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


