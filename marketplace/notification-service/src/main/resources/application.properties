spring.application.name=notification-service
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5456/notification_db
spring.datasource.username=app
spring.datasource.password=app
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:39092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

#Prometheus Endpoint
management.endpoints.web.exposure.include=health,prometheus

# записывать 100% трейсов
management.tracing.sampling.probability=1.0

# KafkaTemplate кладёт traceparent в заголовок сообщения при отправке
spring.kafka.template.observation-enabled=true
# слушатель читает traceparent из заголовка и продолжает трейс
spring.kafka.listener.observation-enabled=true

#куда отправлять traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
