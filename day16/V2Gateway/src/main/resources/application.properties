server.port=8090
spring.application.name=v2gateway
spring.cloud.gateway.server.webflux.routes[0].id=orders
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1




spring.cloud.gateway.server.webflux.routes[1].id=inventory
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=payments
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=Screen
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/mobile/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1


routes[1].filters[1].name=RequestRateLimiter
# 5 токенв в секунду, обьем ведра = 10, сколько стоит один запрос 
spring.cloud.gateway.server.webflux.routes[1].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.key-resolver=#{@userKeyResolver}