spring.application.name=discovery
server.port=8761
# говорим что не  нужно слать запросы регистрации как клиент
eureka.client.register-with-eureka=false
# говорим что не нужно скачивать список экземпляров с сервера
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=false
#нету больше  кеша, клиент видит все экземпляры сразу
eureka.server.use-read-only-response-cache=false
# как часто обновляем кеш
eureka.server.response-cache-update-interval-ms=5000
# как  часто сервер проверяет записи на удаление
eureka.server.eviction-interval-timer-in-ms=3000


