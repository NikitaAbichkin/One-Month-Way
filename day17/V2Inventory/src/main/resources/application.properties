spring.application.name=inventory
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5452/inventory_db
spring.datasource.username=app
spring.datasource.password=app
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost

#как часто клиент скачивает реестр
eureka.client.registry-fetch-interval-seconds=5
# как часто  клиент отправляет свое состояние на сервер
eureka.client.instance-info-replication-interval-seconds=10
#как часто отправлеем heartbeat
eureka.instance.lease-renewal-interval-in-seconds=10
#через  сколько считать клиент упавшим
eureka.instance.lease-expiration-duration-in-seconds=15
# сами меняем состояние
eureka.client.healthcheck.enabled=false

# статус для Eureka берем из /actuator/health
eureka.client.healthcheck.enabled=true
management.endpoint.health.show-details=always
