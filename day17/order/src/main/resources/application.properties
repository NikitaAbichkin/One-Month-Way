spring.application.name=order
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# четко отправляем свое имя хоста (чтобы сервис сам не определял и не сделал ошибок)
eureka.instance.hostname=localhost


#как часто клиент скачивает реестр
eureka.client.registry-fetch-interval-seconds=5
# как часто  клиент отправляет себя на сервер
eureka.client.instance-info-replication-interval-seconds=5
#как часто отправлеем heartbeat
eureka.instance.lease-renewal-interval-in-seconds=5
#через  сколько считать клиент упавшим
eureka.instance.lease-expiration-duration-in-seconds=15

spring.cloud.loadbalancer.cache.ttl=5s

