openapi: 3.1.0
info:
  title: OrderApi
  description: "АПИ ОРДЕР СЕРВИСА"
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
paths:
  /orders:
    post:
      operationId: createOrder
      summary: "Создать заказ епта"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        201:
          description: "Order created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        400:
          description: "Invalid request"
  /orders/{id}:
    get:
      operationId: getOrder
      summary: "Получить заказ по id"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        200:
          description: "Order was get seccessfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        404:
          description: "Order not found"





components:
  schemas:
    OrderRequest:
      type: object
      required:
        - customerEmail
        - amount
      properties:
        customerEmail:
          type: string
        amount:
          type: integer
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customerEmail:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [NEW,PAID,CANCELED]













  
