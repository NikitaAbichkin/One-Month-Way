services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: lox
      RABBITMQ_DEFAULT_PASS: lox
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


volumes:
  rabbitmq_data:









