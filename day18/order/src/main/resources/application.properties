server.port=8081

# добавили записи, удаили старую(получаем актаульную статистику)
resilience4j.circuitbreaker.instances.inventory.sliding-window-type=COUNT_BASED
#всего 10 записей
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=10
#миниум 5 записей для взятия статистики
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5
# со скольки процентов ставить OPEN
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
#ждем 10s перед тем как  сделать HALF_OPEN
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=10s

# сколько запросов  в HALF_OPEN сделать (чтобы сделать статистику)
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=3

# сколько секунд нужно чтобы запрос считался медленным
resilience4j.circuitbreaker.instances.inventory.slow-call-duration-threshold=1s
#со скольки процентов делать OPEN
resilience4j.circuitbreaker.instances.inventory.slow-call-rate-threshold=50

#EXCEPTIONS
#RECORD(те которые считаются за ошибки)
resilience4j.circuitbreaker.instances.inventory.record-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.inventory.record-exceptions[1]=org.springframework.web.client.HttpServerErrorException
#Ignore(те которые считаются как нормалные)
resilience4j.circuitbreaker.instances.inventory.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException

#Чтобы можно было чекать состояние
resilience4j.circuitbreaker.instances.inventory.register-health-indicator=true

# Actuator: health и circuitbreakers
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true


#Retry "inventory"
#всего попыток
resilience4j.retry.instances.inventory.max-attempts=3
# время между  попытками
resilience4j.retry.instances.inventory.wait-duration=2000ms
# экспонентальная прогрессия
resilience4j.retry.instances.inventory.enable-exponential-backoff=true
#коэфицент
resilience4j.retry.instances.inventory.exponential-backoff-multiplier=2

#jitter (рандомная паузам между вызовами)
resilience4j.retry.instances.inventory.enable-randomized-wait=true

# (+-50% к текущей паузе)
resilience4j.retry.instances.inventory.randomized-wait-factor=0.5

# ignoreException(те которые не повторяются)
resilience4j.retry.instances.inventory.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.retry.instances.inventory.ignore-exceptions[1]=org.springframework.web.client.HttpClientErrorException

# 3 одноверменных вызова Bulkhead
resilience4j.bulkhead.instances.inventory.max-concurrent-calls=3

# сколько поток будет ждать чтобы взять соединение перед выходом
resilience4j.bulkhead.instances.inventory.max-wait-duration=0
