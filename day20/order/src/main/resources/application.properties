server.port=8080
management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.instances.inventory.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=20
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=20
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.inventory.register-health-indicator=true
#RETRY
resilience4j.retry.instances.inventory.wait-duration=500ms
resilience4j.retry.instances.inventory.max-attempts=3
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents


resilience4j.retry.instances.inventory.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException

resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

# не нужно писать адресс ведь запускаем в сети  докера
#dockerd  зарезолвит имя
spring.kafka.bootstrap-servers=kafka:9092
